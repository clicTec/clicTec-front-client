<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Página no encontrada | clicTec</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow,noarchive">
  <meta
    name="description"
    content="La URL solicitada no existe o ya no está disponible en clicTec."
  >
  <style>
    body {
      margin: 0;
      font-family: Manrope, system-ui, sans-serif;
      background: linear-gradient(180deg, #f8fafc, #eef2ff);
      color: #0f172a;
    }

    main {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    section {
      width: min(100%, 720px);
      padding: 40px 28px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    p {
      line-height: 1.7;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #0369a1;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.05;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      color: #0f172a;
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: #fff;
    }

    a.primary {
      color: #fff;
      border-color: #0f172a;
      background: #0f172a;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <p class="eyebrow">Error 404</p>
      <h1>Esta página no existe</h1>
      <p>La URL que has abierto no está disponible o ya no existe en clicTec.</p>
      <div class="actions">
        <a class="primary" href="/">Ir al inicio</a>
        <a href="/moviles">Ver reviews de móviles</a>
        <a href="/comparativas">Abrir comparativas</a>
      </div>
    </section>
  </main>
</body>
</html>
