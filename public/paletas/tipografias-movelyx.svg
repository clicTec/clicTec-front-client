<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#08101A"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <style>
      /* TIPOGRAFÍAS (con fallback) */
      .titleFont { font-family: "Orbitron", "Rajdhani", "Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
      .subFont   { font-family: "Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
      .bodyFont  { font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
      .btnFont   { font-family: "Rajdhani", "Orbitron", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

      .muted { fill: rgba(255,255,255,0.66); }
      .white { fill: rgba(255,255,255,0.92); }
      .chip  { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.14); stroke-width: 1; }
      .card  { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.14); stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Header -->
  <g transform="translate(90,70)">
    <text x="0" y="0" class="titleFont white" font-size="44" font-weight="700" dominant-baseline="hanging">
      Sistema tipográfico (Movelyx)
    </text>
    <text x="0" y="58" class="bodyFont muted" font-size="18" font-weight="400" dominant-baseline="hanging">
      4 roles: títulos · subtítulos · texto · botones (con fallback si no tienes las fuentes instaladas)
    </text>
  </g>

  <!-- Cards -->
  <g filter="url(#softShadow)" transform="translate(90,160)">
    <!-- Card 1: Title -->
    <g transform="translate(0,0)">
      <rect width="580" height="300" rx="22" class="card"/>
      <g transform="translate(34,34)">
        <rect width="140" height="34" rx="12" class="chip"/>
        <text x="16" y="17" class="bodyFont white" font-size="14" font-weight="600" dominant-baseline="middle">TÍTULOS</text>

        <text x="0" y="78" class="titleFont white" font-size="46" font-weight="700" letter-spacing="0.5">
          Orbitron
        </text>
        <text x="0" y="128" class="titleFont muted" font-size="22" font-weight="500" letter-spacing="0.2">
          Comparativa iPhone 17 vs Galaxy S26
        </text>

        <text x="0" y="186" class="bodyFont muted" font-size="16" font-weight="400">
          Uso: H1/H2, hero, secciones principales
        </text>
        <text x="0" y="216" class="bodyFont muted" font-size="16" font-weight="400">
          Peso recomendado: 600–700
        </text>
      </g>
    </g>

    <!-- Card 2: Subtitle -->
    <g transform="translate(640,0)">
      <rect width="580" height="300" rx="22" class="card"/>
      <g transform="translate(34,34)">
        <rect width="170" height="34" rx="12" class="chip"/>
        <text x="16" y="17" class="bodyFont white" font-size="14" font-weight="600" dominant-baseline="middle">SUBTÍTULOS</text>

        <text x="0" y="78" class="subFont white" font-size="44" font-weight="700">
          Montserrat
        </text>
        <text x="0" y="128" class="subFont muted" font-size="22" font-weight="600">
          Pantalla · Cámara · Batería · Rendimiento
        </text>

        <text x="0" y="186" class="bodyFont muted" font-size="16" font-weight="400">
          Uso: H3/H4, bloques informativos, labels
        </text>
        <text x="0" y="216" class="bodyFont muted" font-size="16" font-weight="400">
          Peso recomendado: 500–600
        </text>
      </g>
    </g>

    <!-- Card 3: Body -->
    <g transform="translate(0,340)">
      <rect width="580" height="330" rx="22" class="card"/>
      <g transform="translate(34,34)">
        <rect width="160" height="34" rx="12" class="chip"/>
        <text x="16" y="17" class="bodyFont white" font-size="14" font-weight="600" dominant-baseline="middle">TEXTO NORMAL</text>

        <text x="0" y="78" class="bodyFont white" font-size="44" font-weight="700">
          Inter
        </text>

        <text x="0" y="128" class="bodyFont muted" font-size="18" font-weight="400">
          “El rendimiento mejora un 18% en tareas sostenidas y la autonomía sube
        </text>
        <text x="0" y="156" class="bodyFont muted" font-size="18" font-weight="400">
          gracias a una mejor gestión térmica. En fotografía nocturna, el detalle
        </text>
        <text x="0" y="184" class="bodyFont muted" font-size="18" font-weight="400">
          se mantiene más estable y el HDR es menos agresivo.”
        </text>

        <text x="0" y="240" class="bodyFont muted" font-size="16" font-weight="400">
          Uso: párrafos, especificaciones, comparativas, tablas
        </text>
        <text x="0" y="270" class="bodyFont muted" font-size="16" font-weight="400">
          Tamaño recomendado: 15–18px · Peso: 400
        </text>
      </g>
    </g>

    <!-- Card 4: Buttons -->
    <g transform="translate(640,340)">
      <rect width="580" height="330" rx="22" class="card"/>
      <g transform="translate(34,34)">
        <rect width="120" height="34" rx="12" class="chip"/>
        <text x="16" y="17" class="bodyFont white" font-size="14" font-weight="600" dominant-baseline="middle">BOTONES</text>

        <text x="0" y="78" class="btnFont white" font-size="44" font-weight="700" letter-spacing="0.6">
          Rajdhani
        </text>

        <!-- Button mock -->
        <g transform="translate(0,