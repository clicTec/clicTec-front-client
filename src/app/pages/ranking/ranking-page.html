<section class="ranking-page">
  @if (isLoading) {
    <p>Cargando ranking...</p>
  } @else if (errorMessage) {
    <p>{{ errorMessage }}</p>
  } @else if (ranking) {
    <h1 class="ranking-page__title">{{ ranking.title }}</h1>
    <ul class="ranking-page__list">
      @for (item of ranking.items; track item) {
        <li class="ranking-page__item">{{ item }}</li>
      }
    </ul>
  }
</section>
