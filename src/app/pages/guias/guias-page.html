<section class="guias-page">
  @if (isLoading) {
    <p>Cargando guías...</p>
  } @else if (errorMessage) {
    <p>{{ errorMessage }}</p>
  } @else if (guide) {
    <h1 class="guias-page__title">{{ guide.title }}</h1>
    <ul class="guias-page__list">
      @for (item of guide.items; track item) {
        <li class="guias-page__item">{{ item }}</li>
      }
    </ul>
  }
</section>
