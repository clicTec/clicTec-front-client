<section class="comparativas-page">
  <div class="comparativas-page__shell">
    <p class="comparativas-page__eyebrow">Comparador</p>
    <h1 class="comparativas-page__title">Disponible en</h1>

    <div class="comparativas-page__countdown" aria-label="Cuenta atras hasta el jueves 2 de abril de 2026 a las 00:00">
      @for (unit of countdownUnits; track unit.label) {
        <article class="countdown-unit">
          <p class="countdown-unit__value">{{ unit.value }}</p>
          <p class="countdown-unit__label">{{ unit.label }}</p>
        </article>
      }
    </div>

    @if (isFinished) {
      <p class="comparativas-page__status">La cuenta atras ha terminado.</p>
    }
  </div>
</section>
