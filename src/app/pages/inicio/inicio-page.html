<section class="inicio-home">
  @if (isLoading) {
    <p>Cargando portada...</p>
  } @else if (errorMessage) {
    <p>{{ errorMessage }}</p>
  } @else if (home) {
    <header class="inicio-home__masthead">
      <h1 class="inicio-home__title">{{ home.title }}</h1>
      <p class="inicio-home__subtitle">{{ home.subtitle }}</p>
    </header>
  }
</section>
