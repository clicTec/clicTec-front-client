<header class="site-header">
  <div class="site-header__container">
    <a class="site-header__brand" routerLink="/inicio" aria-label="Ir al inicio de clicTec">
      <img
        class="site-header__logo"
        src="/logo/logosinfondo.png"
        alt="clicTec"
        decoding="async"
      >
    </a>

    <nav class="site-header__nav" aria-label="Navegacion principal">
      <a
        class="site-header__link"
        routerLink="/moviles"
        routerLinkActive="site-header__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Moviles
      </a>
      <a class="site-header__link" routerLink="/comparativas" routerLinkActive="site-header__link--active">
        Comparativas
      </a>
      <a class="site-header__link" routerLink="/reviews" routerLinkActive="site-header__link--active">
        Reviews
      </a>
      <a class="site-header__link" routerLink="/guias" routerLinkActive="site-header__link--active">
        Guias
      </a>
      <a class="site-header__link" routerLink="/ranking" routerLinkActive="site-header__link--active">
        Ranking
      </a>
    </nav>

    <button class="site-header__cta" type="button">Suscribete</button>
  </div>
</header>
